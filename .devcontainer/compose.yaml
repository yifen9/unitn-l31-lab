services:
  unitn-l31-lab:
    image: ghcr.io/yifen9/unitn-l31-lab
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: unitn-l31-lab
    working_dir: /workspace
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "..:/workspace"
    networks:
      - lab
    command: >
      bash -c "
        exec sleep infinity
      "

networks:
  lab:
    name: unitn-l31-lab