services:
  unitn-l31-lab:
    image: ghcr.io/yifen9/unitn-l31-lab
    container_name: unitn-l31-lab
    working_dir: /workspace
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "..:/workspace"
    command: >
      bash -c "
        exec sleep infinity
      "
  unitn-l31-lab-db:
    image: postgres
    container_name: unitn-l31-lab-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgres
    ports:
      - 5432:5432
    volumes:
      - "postgresql:/var/lib/postgresql/data"

volumes:
  postgresql: